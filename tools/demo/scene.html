<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Revenue · Dashboard</title>
<!-- Demo scene for the README recording: a clean revenue dashboard to snip and hand to Claude Code. -->
<style>
  :root { --ink:#16171d; --muted:#6b6f80; --line:#ececf2; --indigo:#5b5bd6; --indigo2:#8e93ef; --amber:#f2a33a; --teal:#1fb4a3; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; background:#f5f6fa; color:var(--ink);
         display:grid; grid-template-columns:200px 1fr; }
  nav { background:#fff; border-right:1px solid var(--line); padding:22px 14px; }
  .brand { display:flex; gap:10px; align-items:center; font-weight:650; font-size:15px; margin:0 6px 26px; }
  .logo { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#7c7cf2,#5b5bd6); }
  nav a { display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:8px; color:var(--muted);
          text-decoration:none; font-size:13.5px; margin-bottom:2px; cursor:default; }
  nav a i { width:14px; height:14px; border-radius:4px; background:#d9dae4; }
  nav a.on { background:#eef0fd; color:var(--indigo); font-weight:600; }
  nav a.on i { background:var(--indigo); }
  main { padding:26px 30px; overflow:hidden; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  h1 { font-size:21px; font-weight:650; letter-spacing:-.2px; }
  .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  .btn { background:var(--indigo); color:#fff; border:0; border-radius:9px; padding:9px 16px; font:600 13px inherit; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi small { color:var(--muted); font-size:12px; }
  .kpi b { display:block; font-size:22px; margin-top:4px; letter-spacing:-.3px; }
  .up { color:#14996f; font-size:12px; font-weight:600; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; position:relative; }
  .card h2 { font-size:14.5px; font-weight:650; }
  .tabs { position:absolute; right:18px; top:14px; display:flex; background:#f3f4f8; border-radius:8px; padding:3px; }
  .tabs span { font-size:12px; padding:5px 10px; border-radius:6px; color:var(--muted); }
  .tabs span.on { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px #0001; }
  .card-head { display:flex; align-items:center; gap:18px; margin-bottom:6px; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .plot { display:grid; grid-template-columns:38px 1fr; height:262px; margin-top:12px; }
  .axis { display:flex; flex-direction:column; justify-content:space-between; font-size:11px; color:#9a9eae; padding-bottom:22px; margin-top:-6px; }
  .area { position:relative; }
  .grid { position:absolute; inset:0 0 22px 0; display:flex; flex-direction:column; justify-content:space-between; }
  .grid div { border-top:1px dashed #ececf3; }
  .grid div:last-child { border-top:1px solid #e3e4ec; }
  .bars { position:absolute; inset:0 4px 22px 4px; display:flex; align-items:flex-end; gap:14px; }
  .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .bar span { display:block; }
  .bar .r { background:#c9cbf6; border-radius:6px 6px 0 0; }
  .bar .o { background:var(--indigo); border-radius:0 0 2px 2px; }
  .months { position:absolute; left:4px; right:4px; bottom:0; display:flex; gap:14px; color:var(--muted); font-size:11.5px; }
  .months span { flex:1; text-align:center; }
</style>
</head>
<body>
  <nav>
    <div class="brand"><div class="logo"></div>Northwind</div>
    <a><i></i>Overview</a>
    <a class="on"><i></i>Revenue</a>
    <a><i></i>Customers</a>
    <a><i></i>Products</a>
    <a><i></i>Reports</a>
    <a><i></i>Settings</a>
  </nav>
  <main>
    <header>
      <div><h1>Revenue</h1><div class="sub">Last 12 months · all regions</div></div>
      <button class="btn">Export</button>
    </header>
    <section class="kpis">
      <div class="kpi"><small>Total revenue</small><b>$482,910</b><span class="up">▲ 12.4%</span></div>
      <div class="kpi"><small>Avg. order</small><b>$86.20</b><span class="up">▲ 3.1%</span></div>
      <div class="kpi"><small>New customers</small><b>1,284</b><span class="up">▲ 8.7%</span></div>
    </section>
    <section class="card">
      <div class="card-head">
        <h2>Monthly revenue</h2>
        <div class="legend"><span><i style="background:var(--indigo)"></i>Online</span><span><i style="background:#c9cbf6"></i>Retail</span></div>
      </div>
      <div class="tabs"><span>Week</span><span class="on">Month</span><span>Year</span></div>
      <div class="plot">
        <div class="axis"><span>$60k</span><span>$45k</span><span>$30k</span><span>$15k</span><span>$0</span></div>
        <div class="area">
          <div class="grid"><div></div><div></div><div></div><div></div><div></div></div>
          <div class="bars">
          <div class="bar"><span class="r" style="height:14%"></span><span class="o" style="height:34%"></span></div>
          <div class="bar"><span class="r" style="height:15%"></span><span class="o" style="height:38%"></span></div>
          <div class="bar"><span class="r" style="height:13%"></span><span class="o" style="height:36%"></span></div>
          <div class="bar"><span class="r" style="height:16%"></span><span class="o" style="height:42%"></span></div>
          <div class="bar"><span class="r" style="height:17%"></span><span class="o" style="height:41%"></span></div>
          <div class="bar"><span class="r" style="height:16%"></span><span class="o" style="height:47%"></span></div>
          <div class="bar"><span class="r" style="height:18%"></span><span class="o" style="height:50%"></span></div>
          <div class="bar"><span class="r" style="height:19%"></span><span class="o" style="height:55%"></span></div>
          <div class="bar"><span class="r" style="height:18%"></span><span class="o" style="height:53%"></span></div>
          <div class="bar"><span class="r" style="height:20%"></span><span class="o" style="height:60%"></span></div>
          <div class="bar"><span class="r" style="height:21%"></span><span class="o" style="height:63%"></span></div>
          <div class="bar"><span class="r" style="height:22%"></span><span class="o" style="height:68%"></span></div>
          </div>
          <div class="months"><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
