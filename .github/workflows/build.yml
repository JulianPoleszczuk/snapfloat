name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to publish releases from tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test, publish and package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          ./build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: snapfloat
          path: |
            artifacts/SnapFloat-Setup-*.exe
            artifacts/SnapFloat-*-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SnapFloat-Setup-*.exe
            artifacts/SnapFloat-*-portable.zip
